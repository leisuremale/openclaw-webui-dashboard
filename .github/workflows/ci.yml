name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Cancel in-progress runs on the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (tsc -b)
        run: npx tsc -b

      - name: ESLint
        run: npm run lint

      - name: Vite production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend (py_compile + import smoke)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: py_compile (all sources)
        working-directory: backend
        run: |
          python -m py_compile \
            app/main.py \
            app/routers/overview.py \
            app/services/openclaw.py \
            app/services/helpers/__init__.py \
            app/services/helpers/agents.py \
            app/services/helpers/atomic_io.py \
            app/services/helpers/cron_format.py \
            app/services/helpers/skills_parser.py \
            scripts/refresh_deepseek.py \
            scripts/refresh_minimax.py

      - name: Import smoke test
        working-directory: backend
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('FastAPI app loaded:', app.title)"

      - name: Health endpoint smoke test
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18790 &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:18790/api/health
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS

  shell:
    name: Shell (syntax check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          bash -n install.sh
          bash -n start.sh
